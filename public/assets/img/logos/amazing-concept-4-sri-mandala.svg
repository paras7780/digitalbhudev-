<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="100%" height="100%">
  <defs>
    <!-- Imperial 24K Gold -->
    <linearGradient id="imperialGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Royal Velvet Maroon -->
    <linearGradient id="velvetMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="45%" stop-color="#500724"/>
      <stop offset="100%" stop-color="#2a0212"/>
    </linearGradient>

    <radialGradient id="mandalaShine" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <filter id="sealShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#500724" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- ================= MASTER EMBLEM (ROYAL SRI MANDALA SEAL) ================= -->
  <g transform="translate(18, 10)">
    <!-- 16 Sacred Outer Rays / Sunburst -->
    <g transform="translate(60, 60)" stroke="url(#imperialGold)" stroke-linecap="round" opacity="0.85">
      <!-- 16 radiating diamond tips -->
      <line x1="0" y1="-50" x2="0" y2="-56" stroke-width="2.5"/>
      <line x1="19.1" y1="-46.2" x2="21.4" y2="-51.7" stroke-width="2"/>
      <line x1="35.4" y1="-35.4" x2="39.6" y2="-39.6" stroke-width="2.5"/>
      <line x1="46.2" y1="-19.1" x2="51.7" y2="-21.4" stroke-width="2"/>
      <line x1="50" y1="0" x2="56" y2="0" stroke-width="2.5"/>
      <line x1="46.2" y1="19.1" x2="51.7" y2="21.4" stroke-width="2"/>
      <line x1="35.4" y1="35.4" x2="39.6" y2="39.6" stroke-width="2.5"/>
      <line x1="19.1" y1="46.2" x2="21.4" y2="51.7" stroke-width="2"/>
      <line x1="0" y1="50" x2="0" y2="56" stroke-width="2.5"/>
      <line x1="-19.1" y1="46.2" x2="-21.4" y2="51.7" stroke-width="2"/>
      <line x1="-35.4" y1="35.4" x2="-39.6" y2="39.6" stroke-width="2.5"/>
      <line x1="-46.2" y1="19.1" x2="-51.7" y2="21.4" stroke-width="2"/>
      <line x1="-50" y1="0" x2="-56" y2="0" stroke-width="2.5"/>
      <line x1="-46.2" y1="-19.1" x2="-51.7" y2="-21.4" stroke-width="2"/>
      <line x1="-35.4" y1="-35.4" x2="-39.6" y2="-39.6" stroke-width="2.5"/>
      <line x1="-19.1" y1="-46.2" x2="-21.4" y2="-51.7" stroke-width="2"/>
    </g>

    <!-- Main Medallion Body -->
    <circle cx="60" cy="60" r="48" fill="url(#velvetMaroon)" stroke="url(#imperialGold)" stroke-width="3" filter="url(#sealShadow)"/>

    <!-- Concentric Filigree Rings -->
    <circle cx="60" cy="60" r="42" fill="none" stroke="#fde047" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.75"/>
    <circle cx="60" cy="60" r="38" fill="none" stroke="url(#imperialGold)" stroke-width="1" opacity="0.5"/>

    <!-- Sacred 8-Petaled Lotus Pattern inside Medallion -->
    <g transform="translate(60, 60)" fill="url(#imperialGold)" opacity="0.25">
      <ellipse cx="0" cy="-28" rx="6" ry="10"/>
      <ellipse cx="19.8" cy="-19.8" rx="6" ry="10" transform="rotate(45 19.8 -19.8)"/>
      <ellipse cx="28" cy="0" rx="10" ry="6"/>
      <ellipse cx="19.8" cy="19.8" rx="6" ry="10" transform="rotate(-45 19.8 19.8)"/>
      <ellipse cx="0" cy="28" rx="6" ry="10"/>
      <ellipse cx="-19.8" cy="19.8" rx="6" ry="10" transform="rotate(45 -19.8 19.8)"/>
      <ellipse cx="-28" cy="0" rx="10" ry="6"/>
      <ellipse cx="-19.8" cy="-19.8" rx="6" ry="10" transform="rotate(-45 -19.8 -19.8)"/>
    </g>

    <!-- Centerpiece Golden Om (3D Bevel Appearance) -->
    <text x="60" y="70" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="900" fill="url(#imperialGold)" text-anchor="middle">
      ॐ
    </text>

    <!-- Digital Connection Nodes embedded in rim -->
    <circle cx="60" cy="18" r="2.2" fill="#ffffff"/>
    <circle cx="102" cy="60" r="2.2" fill="#ffffff"/>
    <circle cx="60" cy="102" r="2.2" fill="#ffffff"/>
    <circle cx="18" cy="60" r="2.2" fill="#ffffff"/>
  </g>

  <!-- ================= TYPOGRAPHY & BRAND LOCKUP ================= -->
  <g transform="translate(152, 38)">
    <text x="0" y="38" font-family="'Playfair Display', Georgia, serif" font-size="40" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#500724">Digital</tspan><tspan fill="#b45309" dx="3">Bhudev</tspan>
    </text>

    <!-- Tagline Ribbon -->
    <g transform="translate(2, 62)">
      <!-- Golden Saffron Emblems -->
      <polygon points="0,-8 7,-12 14,-8 7,-4" fill="url(#imperialGold)"/>

      <text x="24" y="-5" font-family="'Cinzel', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" letter-spacing="4.5" fill="#831843" text-transform="uppercase">
        VISHWAS NO SETU
      </text>

      <text x="204" y="-5" font-family="'Shruti', 'Gujarati Sangam MN', sans-serif" font-size="12" font-weight="700" fill="#b45309" letter-spacing="0.5">
        • સનાતન સંસ્કાર સેતુ
      </text>

      <polygon points="340,-8 347,-12 354,-8 347,-4" fill="url(#imperialGold)"/>
    </g>

    <text x="3" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="1.5">
      TRUSTED VEDIC KARAMKAND • EXPERT PUJAS • GENUINE PANDITS
    </text>
  </g>
</svg>
