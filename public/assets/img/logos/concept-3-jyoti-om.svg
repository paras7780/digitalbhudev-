<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon: Elegant Minimalist Flame & Node -->
  <g transform="translate(20, 10)">
    <!-- Outer Sacred Flame Silhouette -->
    <path d="M 45 8 C 45 8, 20 42, 20 62 C 20 78, 32 90, 48 90 C 64 90, 76 78, 76 62 C 76 44, 58 24, 45 8 Z" fill="url(#flameGrad)"/>
    
    <!-- Inner Core Flame with Om Silhouette -->
    <path d="M 48 30 C 48 30, 32 50, 32 64 C 32 74, 40 82, 48 82 C 56 82, 64 74, 64 64 C 64 50, 48 30, 48 30 Z" fill="url(#flameInner)"/>

    <!-- Digital Radiance Rings (Setu Waves) -->
    <circle cx="48" cy="64" r="38" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.35"/>
    <circle cx="48" cy="64" r="45" fill="none" stroke="#db2777" stroke-width="1" stroke-dasharray="2 8" opacity="0.25"/>
    
    <!-- Central Om Character (Crisp Gold Accent) -->
    <text x="48" y="70" font-family="'Cinzel', Georgia, serif" font-size="20" font-weight="900" fill="#c2410c" text-anchor="middle">
      ॐ
    </text>
  </g>

  <!-- Typography -->
  <g transform="translate(125, 34)">
    <text x="0" y="32" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#0f172a">Digital</tspan><tspan fill="#ea580c">Bhudev</tspan>
    </text>
    <g transform="translate(2, 53)">
      <text x="0" y="-5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.5" fill="#be185d" text-transform="uppercase">
        VISHWAS NO SETU
      </text>
      <text x="160" y="-5" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
        | સત્ય • શ્રદ્ધા • સંસ્કાર
      </text>
    </g>
  </g>
</svg>
