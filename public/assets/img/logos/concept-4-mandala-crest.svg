<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="crestMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#500724"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon: Royal Vedic Seal -->
  <g transform="translate(15, 10)">
    <!-- Sunburst Radiance / 12 Rays -->
    <g transform="translate(50, 50)" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.65">
      <line x1="0" y1="-44" x2="0" y2="-48"/>
      <line x1="22" y1="-38" x2="24" y2="-42"/>
      <line x1="38" y1="-22" x2="42" y2="-24"/>
      <line x1="44" y1="0" x2="48" y2="0"/>
      <line x1="38" y1="22" x2="42" y2="24"/>
      <line x1="22" y1="38" x2="24" y2="42"/>
      <line x1="0" y1="44" x2="0" y2="48"/>
      <line x1="-22" y1="38" x2="-24" y2="42"/>
      <line x1="-38" y1="22" x2="-42" y2="24"/>
      <line x1="-44" y1="0" x2="-48" y2="0"/>
      <line x1="-38" y1="-22" x2="-42" y2="-24"/>
      <line x1="-22" y1="-38" x2="-24" y2="-42"/>
    </g>

    <!-- Outer Gold Border -->
    <circle cx="50" cy="50" r="42" fill="url(#crestMaroon)" stroke="url(#crestGold)" stroke-width="2.5"/>
    <circle cx="50" cy="50" r="37" fill="none" stroke="#fde68a" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- Sacred Om In Center -->
    <text x="50" y="58" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="900" fill="url(#crestGold)" text-anchor="middle">
      ॐ
    </text>

    <!-- Base Lotus Petals -->
    <path d="M 32 75 C 40 70, 46 70, 50 75 C 54 70, 60 70, 68 75 C 60 80, 40 80, 32 75 Z" fill="#fbbf24" opacity="0.9"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 34)">
    <text x="0" y="32" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="800">
      <tspan fill="#500724">Digital</tspan><tspan fill="#b45309">Bhudev</tspan>
    </text>
    <g transform="translate(2, 54)">
      <rect x="0" y="-8" width="18" height="2" fill="#b45309"/>
      <text x="26" y="-6" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" letter-spacing="4" fill="#831843" text-transform="uppercase">
        VISHWAS NO SETU
      </text>
      <text x="180" y="-6" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1">
        • EST. VEDIC TRUST
      </text>
    </g>
  </g>
</svg>
