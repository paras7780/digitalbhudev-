<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="softBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon: Sacred Kalash & Flame -->
  <g transform="translate(15, 12)">
    <!-- Soft Hexagon Badge -->
    <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#softBg)" stroke="#fde68a" stroke-width="1.5"/>

    <!-- Sacred Kalash Base -->
    <path d="M 28 68 C 28 82, 68 82, 68 68 C 68 56, 62 50, 58 48 L 38 48 C 34 50, 28 56, 28 68 Z" fill="url(#gradGold)"/>
    <!-- Kalash Neck Rim -->
    <rect x="34" y="44" width="28" height="5" rx="2.5" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    
    <!-- Mango Leaves (Amra Pallav) -->
    <path d="M 38 44 C 30 36, 24 38, 20 42 C 24 45, 34 46, 38 44 Z" fill="#15803d"/>
    <path d="M 58 44 C 66 36, 72 38, 76 42 C 72 45, 62 46, 58 44 Z" fill="#15803d"/>
    <path d="M 48 44 C 42 34, 40 26, 48 20 C 56 26, 54 34, 48 44 Z" fill="#16a34a"/>

    <!-- Sacred Coconut (Shriphal) & Divine Flame (Jyoti) -->
    <path d="M 48 20 C 44 26, 44 32, 48 36 C 52 32, 52 26, 48 20 Z" fill="url(#gradRuby)"/>
    <circle cx="48" cy="27" r="2.5" fill="#fef08a"/>

    <!-- Digital Swastik / Micro-circuits on Kalash -->
    <circle cx="48" cy="62" r="3" fill="#ffffff"/>
    <path d="M 42 62 L 54 62 M 48 56 L 48 68" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 34)">
    <text x="0" y="32" font-family="'Cinzel', 'Playfair Display', serif" font-size="34" font-weight="800">
      <tspan fill="#0f172a">Digital</tspan><tspan fill="#b91c1c">Bhudev</tspan>
    </text>
    <g transform="translate(2, 54)">
      <circle cx="4" cy="-7" r="3.5" fill="#f59e0b"/>
      <text x="16" y="-4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" letter-spacing="3" fill="#b45309" text-transform="uppercase">
        VISHWAS NO SETU
      </text>
      <text x="168" y="-4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">
        • TRADITION &amp; TECHNOLOGY
      </text>
    </g>
  </g>
</svg>
