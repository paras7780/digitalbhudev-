<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="gradOm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#db2777" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Glow Circle -->
    <circle cx="50" cy="50" r="48" fill="url(#gradBridge)" filter="url(#glow)"/>
    
    <!-- Digital Connection Arcs / Setu Bridge -->
    <path d="M 22 66 Q 50 30 78 66" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 0" opacity="0.45"/>
    <path d="M 16 74 Q 50 20 84 74" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Connection Node Dots -->
    <circle cx="22" cy="66" r="3.5" fill="#fef3c7"/>
    <circle cx="78" cy="66" r="3.5" fill="#fef3c7"/>
    <circle cx="50" cy="38" r="4" fill="#ffffff"/>

    <!-- Sacred Om Motif -->
    <g transform="translate(26, 26) scale(0.72)" fill="url(#gradOm)">
      <path d="M34.2,16.5 C32.1,14.2 29.3,13 26.2,13 C20.3,13 15.6,17.7 15.6,23.6 C15.6,26.5 16.8,29.2 18.8,31.2 C15.2,33.5 13,37.6 13,42.2 C13,49.8 19.2,56 26.8,56 C33.1,56 38.5,51.8 40.1,45.8 C41.2,49.8 44.8,52.8 49.2,53 C45.5,57.8 40.2,61 34,61 C32.6,61 31.5,62.1 31.5,63.5 C31.5,64.9 32.6,66 34,66 C42.1,66 49,61.8 53.2,55.2 C54.5,53.2 55.2,50.8 55.2,48.2 C55.2,42.1 50.3,37.2 44.2,37.2 C42.6,37.2 41,37.6 39.7,38.2 C38.8,34.8 36.6,32 33.7,30.2 C35.8,28.5 37.2,25.8 37.2,22.8 C37.2,20.3 36.1,18.1 34.2,16.5 Z M26.8,51 C22,51 18,47 18,42.2 C18,37.5 21.8,33.6 26.5,33.4 C29.8,35.2 32.2,38.2 33.1,41.8 C32.8,47 29.8,51 26.8,51 Z M26.2,18 C28.8,18 31,20.2 31,22.8 C31,25.4 28.8,27.6 26.2,27.6 C23.6,27.6 21.4,25.4 21.4,22.8 C21.4,20.2 23.6,18 26.2,18 Z M44.2,42 C47.6,42 50.2,44.7 50.2,48 C50.2,51.3 47.6,54 44.2,54 C40.9,54 38.2,51.3 38.2,48 C38.2,44.7 40.9,42 44.2,42 Z"/>
      <!-- Chandrabindu -->
      <path d="M46,12 C41,12 37,15.5 36,19 C38.5,17.5 41.5,16.5 45,16.5 C48.5,16.5 51.5,17.5 54,19 C53,15.5 49,12 46,12 Z"/>
      <circle cx="45" cy="8" r="3.2"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 34)">
    <!-- Main Title -->
    <text x="0" y="32" font-family="'Cinzel', 'Playfair Display', 'Cinzel Decorative', Georgia, serif" font-size="34" font-weight="800" letter-spacing="0.5">
      <tspan fill="#1e1b4b">Digital</tspan><tspan fill="#db2777">Bhudev</tspan>
    </text>

    <!-- Tagline & Setu Badge -->
    <g transform="translate(2, 54)">
      <!-- Saffron accent dash -->
      <rect x="0" y="-8" width="22" height="2.5" rx="1.25" fill="#f59e0b"/>
      <text x="30" y="-6" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11.5" font-weight="700" letter-spacing="3.5" fill="#d97706" text-transform="uppercase">
        VISHWAS NO SETU
      </text>
      <text x="184" y="-6" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#9ca3af" letter-spacing="1">
        • VEDIC PLATFORM
      </text>
    </g>
  </g>
</svg>
