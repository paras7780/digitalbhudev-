<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="100%" height="100%">
  <defs>
    <!-- Hyper-Modern Aurora Gradient -->
    <linearGradient id="auroraGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="35%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Deep Satin Navy -->
    <linearGradient id="satinDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <radialGradient id="auroraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#db2777" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>

    <filter id="monogramShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ea580c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ================= MASTER EMBLEM ('DB' SACRED KNOT & FLAME) ================= -->
  <g transform="translate(20, 10)">
    <!-- Soft Background Glow -->
    <circle cx="58" cy="60" r="56" fill="url(#auroraGlow)"/>

    <!-- Outer Rounded App Icon Container (Subtle Squircle Border) -->
    <rect x="8" y="10" width="100" height="100" rx="28" fill="#ffffff" stroke="#f1f5f9" stroke-width="2" filter="url(#monogramShadow)"/>
    <rect x="8" y="10" width="100" height="100" rx="28" fill="none" stroke="url(#auroraGrad)" stroke-width="1.5" opacity="0.4"/>

    <!-- Sacred 'DB' Intertwined Ribbon & Akhand Jyoti Flame -->
    <g transform="translate(18, 16)">
      <!-- Left Stem forming the 'D' and base of Om -->
      <path d="M 24 72 L 24 28 C 24 18, 38 18, 48 28 C 58 38, 58 54, 48 64 C 40 72, 30 72, 24 72 Z" 
            fill="none" 
            stroke="url(#auroraGrad)" 
            stroke-width="7" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Right Upper Loop of 'B' forming the Sacred Om Arch -->
      <path d="M 36 28 C 48 14, 66 18, 70 32 C 74 44, 62 50, 48 50" 
            fill="none" 
            stroke="url(#auroraGrad)" 
            stroke-width="6.5" 
            stroke-linecap="round"/>

      <!-- Right Lower Loop of 'B' swooping into the Setu Tail -->
      <path d="M 48 50 C 66 50, 74 60, 70 72 C 66 82, 48 86, 36 82 C 28 78, 20 84, 16 88" 
            fill="none" 
            stroke="url(#auroraGrad)" 
            stroke-width="6.5" 
            stroke-linecap="round"/>

      <!-- Divine Akhand Jyoti Flame Rising from Top Center -->
      <path d="M 40 18 C 36 8, 42 2, 44 -2 C 46 2, 52 8, 48 18 Z" fill="url(#auroraGrad)"/>
      <circle cx="44" cy="6" r="2.2" fill="#ffffff"/>

      <!-- Sacred Bindu Core Point -->
      <circle cx="66" cy="18" r="3" fill="#f59e0b"/>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY & BRAND LOCKUP ================= -->
  <g transform="translate(152, 38)">
    <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.8">
      <tspan fill="#0f172a">Digital</tspan><tspan fill="#db2777" dx="2">Bhudev</tspan>
    </text>

    <!-- Modern Tech Tagline Ribbon -->
    <g transform="translate(2, 62)">
      <!-- Gradient Pill Badge for Tagline -->
      <rect x="0" y="-15" width="168" height="22" rx="11" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
      <circle cx="12" cy="-4" r="3" fill="#db2777"/>
      <text x="22" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" letter-spacing="2.5" fill="#be185d" text-transform="uppercase">
        VISHWAS NO SETU
      </text>

      <!-- Gujarati Sacred Subtext -->
      <text x="184" y="0" font-family="'Shruti', 'Gujarati Sangam MN', sans-serif" font-size="12" font-weight="700" fill="#ea580c">
        વૈદિક પરંપરા અને આધુનિક ટેકનોલોજીનો સેતુ
      </text>
    </g>

    <text x="3" y="79" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="1.2">
      BHUDEV DIRECTORY • PUJA SAMAGRI • JYOTISH &amp; KATHA
    </text>
  </g>
</svg>
